# Tedarik Portalı — aynı sunucudaki diğer uygulamalardan yalıtılmış kurulum.
# Proje adı, ağlar, volume'lar ve konteyner adları "tedarik" önekli. Uygulama yalnızca 127.0.0.1 üzerinde dinler;
# dışarıya açmak (alan adı, TLS ters vekili) ayrı bir karardır (docs/DAGITIM.md). PostgreSQL dışarıya kapalı iç ağdadır.
# Bellek, işlemci ve süreç sınırları sunucudaki diğer uygulamaların kaynaklarını korur.
name: tedarik
services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    environment:
      POSTGRES_DB: tedarik
      POSTGRES_USER: tedarik
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedarik -d tedarik"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 200
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  app:
    build:
      context: ..
    image: tedarik-app:${TEDARIK_RELEASE:-local}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEDARIK_AUTH_MODE: ${TEDARIK_AUTH_MODE:-local}
      TEDARIK_COOKIE_SECURE: ${TEDARIK_COOKIE_SECURE:-0}
      TEDARIK_DATABASE_URL_FILE: /run/secrets/database_url
      TEDARIK_API_KEY_FILE: /run/secrets/mcp_api_key
      TEDARIK_DB_POOL_SIZE: "10"
    secrets: [database_url, mcp_api_key]
    ports:
      - "127.0.0.1:${TEDARIK_PORT:-18090}:8090"
    networks: [internal, edge]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 120
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
networks:
  internal:
    internal: true
  edge: {}
volumes:
  pgdata:
secrets:
  db_password:
    file: ${TEDARIK_SECRETS:?TEDARIK_SECRETS klasörü gerekli}/db_password
  database_url:
    file: ${TEDARIK_SECRETS}/database_url
  mcp_api_key:
    file: ${TEDARIK_SECRETS}/mcp_api_key
