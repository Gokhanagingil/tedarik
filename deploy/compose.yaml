# Tedarik Portalı — aynı sunucudaki diğer uygulamalardan yalıtılmış kurulum.
# Proje adı, ağlar, volume'lar ve konteyner adları "tedarik" önekli. Uygulama yalnızca 127.0.0.1 üzerinde dinler;
# dışarıya yalnızca "tls" profilindeki Caddy (443) açılır (K-014). PostgreSQL dışarıya kapalı iç ağdadır.
# Bellek, işlemci ve süreç sınırları sunucudaki diğer uygulamaların kaynaklarını korur.
name: tedarik
services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    environment:
      POSTGRES_DB: tedarik
      POSTGRES_USER: tedarik
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedarik -d tedarik"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 200
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  app:
    build:
      context: ..
    image: tedarik-app:${TEDARIK_RELEASE:-local}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEDARIK_AUTH_MODE: ${TEDARIK_AUTH_MODE:-local}
      TEDARIK_COOKIE_SECURE: ${TEDARIK_COOKIE_SECURE:-0}
      TEDARIK_TRUST_PROXY: ${TEDARIK_TRUST_PROXY:-0}
      TEDARIK_DATABASE_URL_FILE: /run/secrets/database_url
      TEDARIK_API_KEY_FILE: /run/secrets/mcp_api_key
      TEDARIK_DB_POOL_SIZE: "10"
      # ServiceNow CMDB (K-019): adres ve kullanıcı ayar dosyasından; parola yalnızca sunucudaki sır dosyasında
      TEDARIK_SN_INSTANCE: ${TEDARIK_SN_INSTANCE:-}
      TEDARIK_SN_USER: ${TEDARIK_SN_USER:-}
      TEDARIK_SN_PASSWORD_FILE: /run/secrets/sn_password
      TEDARIK_APP_NAME: ${TEDARIK_APP_NAME:-GRC Platformu}
      # ServiceNow MCP sunucusu (K-021): adres ayar dosyasından; belirteç veya OAuth istemci sırrı sır dosyasında
      TEDARIK_SN_MCP_URL: ${TEDARIK_SN_MCP_URL:-}
      TEDARIK_SN_MCP_TOKEN_FILE: ${TEDARIK_SN_MCP_TOKEN_FILE:-}
      TEDARIK_SN_MCP_TOKEN_URL: ${TEDARIK_SN_MCP_TOKEN_URL:-}
      TEDARIK_SN_MCP_CLIENT_ID: ${TEDARIK_SN_MCP_CLIENT_ID:-}
      TEDARIK_SN_MCP_CLIENT_SECRET_FILE: ${TEDARIK_SN_MCP_CLIENT_SECRET_FILE:-}
      # Kurumsal giriş (Entra ID + MFA): deploy.sh, /opt/tedarik/entra.env varsa doldurur
      TEDARIK_ENTRA_TENANT_ID: ${TEDARIK_ENTRA_TENANT_ID:-}
      TEDARIK_ENTRA_CLIENT_ID: ${TEDARIK_ENTRA_CLIENT_ID:-}
      TEDARIK_ENTRA_AUTH_CONTEXT: ${TEDARIK_ENTRA_AUTH_CONTEXT:-}
      TEDARIK_ENTRA_REDIRECT_URI: ${TEDARIK_ENTRA_REDIRECT_URI:-}
      TEDARIK_ENTRA_CLIENT_SECRET_FILE: ${TEDARIK_ENTRA_CLIENT_SECRET_FILE:-}
    secrets: [database_url, mcp_api_key, sn_password, sn_mcp_token, sn_mcp_client_secret, entra_client_secret]
    ports:
      - "127.0.0.1:${TEDARIK_PORT:-18090}:8090"
    networks: [internal, edge]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 120
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  # TLS ters vekili: yalnızca TEDARIK_DOMAIN verildiğinde ("tls" profili) çalışır; yalnızca 443'ü açar.
  proxy:
    profiles: [tls]
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TEDARIK_DOMAIN: ${TEDARIK_DOMAIN:-localhost}
    ports:
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 60
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
networks:
  internal:
    internal: true
  edge: {}
volumes:
  pgdata:
  caddy_data:
  caddy_config:
secrets:
  db_password:
    file: ${TEDARIK_SECRETS:?TEDARIK_SECRETS klasörü gerekli}/db_password
  database_url:
    file: ${TEDARIK_SECRETS}/database_url
  mcp_api_key:
    file: ${TEDARIK_SECRETS}/mcp_api_key
  sn_password:
    file: ${TEDARIK_SECRETS}/sn_password
  sn_mcp_token:
    file: ${TEDARIK_SECRETS}/sn_mcp_token
  sn_mcp_client_secret:
    file: ${TEDARIK_SECRETS}/sn_mcp_client_secret
  entra_client_secret:
    file: ${TEDARIK_SECRETS}/entra_client_secret
