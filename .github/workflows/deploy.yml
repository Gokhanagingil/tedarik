name: Deploy Tedarik (isolated)
# Yalnızca elle başlatılır. Önce testler, sonra kaynak arşivi SSH ile sunucuya gider ve deploy/deploy.sh çalışır.
# Gerekli gizli değerler (Settings -> Secrets and variables -> Actions veya "tedarik" ortamı):
#   TEDARIK_SSH_HOST, TEDARIK_SSH_USER, TEDARIK_SSH_KEY (özel anahtar), TEDARIK_SSH_KNOWN_HOSTS (ssh-keyscan çıktısı)
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "HTTPS alan adı (boş: sunucudaki kayıtlı ayar korunur)"
        type: string
        default: "tedarik.204-168-247-101.sslip.io"
      seed_demo:
        description: "Sentetik demo veriyi yükle (yalnızca boş veya demo içeren veritabanına)"
        type: boolean
        default: false
      install_docker:
        description: "Sunucuda Docker yoksa Ubuntu paketlerinden kur (docker.io, docker-compose-v2)"
        type: boolean
        default: false
      auth_mode:
        description: "Giriş modu (keep: sunucudaki ayar korunur; entra: Yönetim → Entegrasyonlar'daki Entra tanımı)"
        type: choice
        options: [keep, local, entra]
        default: keep
      acceptance:
        description: "Kurulumdan sonra canlı kabul testini çalıştır (scripts/acceptance.py; KABUL işaretli kayıt yazar)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tedarik-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: tedarik
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests before touching the server
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m unittest discover -s tests
          node --check tedarik/static/app.js && node --check tedarik/static/pages.js && node --check tedarik/static/grc.js && node --check tedarik/static/admin.js && node --check tedarik/static/assurance.js
          sh -n deploy/deploy.sh && sh -n deploy/backup.sh
      - name: Verify deployment secrets
        env:
          HOST: ${{ secrets.TEDARIK_SSH_HOST }}
          USER: ${{ secrets.TEDARIK_SSH_USER }}
          KEY: ${{ secrets.TEDARIK_SSH_KEY }}
          KNOWN: ${{ secrets.TEDARIK_SSH_KNOWN_HOSTS }}
        run: |
          for v in HOST USER KEY KNOWN; do eval "test -n \"\$$v\"" || { echo "Eksik gizli değer: TEDARIK_SSH_$v"; exit 1; }; done
      - name: Deploy over SSH (only /opt/tedarik and the "tedarik" compose project)
        env:
          HOST: ${{ secrets.TEDARIK_SSH_HOST }}
          USER: ${{ secrets.TEDARIK_SSH_USER }}
          KEY: ${{ secrets.TEDARIK_SSH_KEY }}
          KNOWN: ${{ secrets.TEDARIK_SSH_KNOWN_HOSTS }}
          INSTALL_DOCKER: ${{ inputs.install_docker && '1' || '0' }}
          DOMAIN: ${{ inputs.domain }}
          SEED_DEMO: ${{ inputs.seed_demo && '1' || '0' }}
          AUTH_MODE: ${{ inputs.auth_mode || 'keep' }}
        run: |
          set -eu
          case "$DOMAIN" in *[!a-z0-9.-]*) echo "Geçersiz alan adı"; exit 1;; esac
          case "$AUTH_MODE" in keep|local|entra) ;; *) echo "Geçersiz giriş modu"; exit 1;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # Gizli olmayan parmak izleri: değerlerin doğru girildiğini günlükten doğrulamak için.
          echo "Sunucu kimliği (TEDARIK_SSH_KNOWN_HOSTS):"; ssh-keygen -lf ~/.ssh/known_hosts
          echo "Dağıtım anahtarı (TEDARIK_SSH_KEY, açık kısmı):"; ssh-keygen -y -f ~/.ssh/id_deploy | ssh-keygen -lf -
          grep -q "^$HOST " ~/.ssh/known_hosts || { echo "known_hosts satırı $HOST ile başlamıyor"; exit 1; }
          git archive --format=tar.gz -o tedarik.tar.gz HEAD
          OPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15"
          scp $OPTS tedarik.tar.gz "$USER@$HOST:/tmp/tedarik-$GITHUB_SHA.tar.gz"
          ssh $OPTS "$USER@$HOST" "set -eu
            S=''; [ \$(id -u) = 0 ] || S='sudo -n'
            R=/opt/tedarik/releases/$GITHUB_SHA
            \$S mkdir -p \$R && \$S chmod 0700 /opt/tedarik
            \$S tar -xzf /tmp/tedarik-$GITHUB_SHA.tar.gz -C \$R && rm -f /tmp/tedarik-$GITHUB_SHA.tar.gz
            \$S ln -sfn \$R /opt/tedarik/current
            \$S env TEDARIK_RELEASE=${GITHUB_SHA::12} TEDARIK_INSTALL_DOCKER=$INSTALL_DOCKER TEDARIK_DOMAIN=$DOMAIN TEDARIK_SEED_DEMO=$SEED_DEMO TEDARIK_AUTH_MODE_SET=$AUTH_MODE sh /opt/tedarik/current/deploy/deploy.sh"
      - name: External HTTPS check (certificate, security headers, anonymous access denied)
        if: inputs.domain != ''
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -eu
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null --max-time 10 "https://$DOMAIN/login"; then break; fi
            echo "Sertifika veya bağlantı bekleniyor ($i/24)"; sleep 10
          done
          curl -sS -D headers.txt -o /dev/null --max-time 10 "https://$DOMAIN/login"
          grep -i '^strict-transport-security' headers.txt
          grep -i '^content-security-policy' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/tdr/suppliers")" = 401
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -issuer -enddate
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  acceptance:
    # Canlı kabul testi: geçici bir kabul yöneticisi (kabul.yonetici) açılır/sıfırlanır; parola ve MCP anahtarı
    # günlükte maskelenir, yalnızca bu işin belleğinde kalır. Test sonunda kabul yöneticisinin parolası yeniden
    # rastgele yapılır (kimse bilmez); test hesapları test içinde devre dışı bırakılır.
    needs: deploy
    if: inputs.acceptance && inputs.domain != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: tedarik
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Acceptance credentials (masked, never written to disk)
        env:
          HOST: ${{ secrets.TEDARIK_SSH_HOST }}
          USER: ${{ secrets.TEDARIK_SSH_USER }}
          KEY: ${{ secrets.TEDARIK_SSH_KEY }}
          KNOWN: ${{ secrets.TEDARIK_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          OPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15"
          OUT=$(ssh $OPTS "$USER@$HOST" "sudo -n docker exec tedarik-app-1 python -m tedarik.bootstrap reset kabul.yonetici --force")
          PASS=$(printf '%s\n' "$OUT" | sed -n 's/^Gecici parola: //p')
          test -n "$PASS"
          echo "::add-mask::$PASS"
          MCP=$(ssh $OPTS "$USER@$HOST" "sudo -n cat /opt/tedarik/secrets/mcp_api_key")
          echo "::add-mask::$MCP"
          { echo "TDR_ADMIN_PASS=$PASS"; echo "TDR_MCP_KEY=$MCP"; } >> "$GITHUB_ENV"
      - name: Live acceptance test
        env:
          TDR_BASE: https://${{ inputs.domain }}
          TDR_ADMIN_USER: kabul.yonetici
        run: python scripts/acceptance.py kabul
      - name: Lock the acceptance administrator (random password nobody knows)
        if: always()
        env:
          HOST: ${{ secrets.TEDARIK_SSH_HOST }}
          USER: ${{ secrets.TEDARIK_SSH_USER }}
        run: |
          OPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15"
          ssh $OPTS "$USER@$HOST" "sudo -n docker exec tedarik-app-1 python -m tedarik.bootstrap reset kabul.yonetici --force >/dev/null" || true
          rm -f ~/.ssh/id_deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kabul-${{ github.run_id }}
          path: kabul/
          retention-days: 30
