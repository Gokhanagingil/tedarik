name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663   # compose ile aynı özet
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: tedarik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEDARIK_TEST_DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/tedarik_test' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # SQLite işi bilerek paketsizdir: çekirdeğin ek paket istemediğini kanıtlar (Entra testleri atlanır).
      - name: Install hash-locked dependencies
        if: matrix.engine == 'postgres'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py tedarik tests
      - name: Tests (${{ matrix.engine }})
        run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies and browser
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Validate browser JavaScript
        run: node --check tedarik/static/app.js && node --check tedarik/static/pages.js && node --check tedarik/static/grc.js
      - name: Browser smoke test with synthetic data
        run: python scripts/browser_smoke.py verification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: arayuz-${{ github.run_id }}
          path: verification/
          retention-days: 14
  security:
    # Güvenlik kapıları: statik analiz, bağımlılık açıkları, sır taraması. Araçlar sürümle sabittir; uygulamaya girmez.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install scanners (pinned)
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1 detect-secrets==1.5.0
      # B608 (dinamik SQL) incelendi: tablo/sütun adları yalnızca şemadan gelir, bilinmeyen alan SQL'den önce reddedilir,
      # değerler her zaman parametrelidir. Orta ve üstü önem + güven seviyesindeki diğer her bulgu işi durdurur.
      - name: Static analysis (bandit)
        run: bandit -q -r tedarik app.py -x tedarik/vendor -ll -ii --skip B608
      - name: Dependency vulnerabilities (pip-audit, hash-locked requirements)
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
      # Yeni bulunan her sır (dosya + özet) incelenmiş temel dosyada "is_secret: false" olarak bulunmalı; satır kayması sorun değil.
      - name: Secret scan (detect-secrets, audited baseline)
        run: |
          detect-secrets scan --exclude-files '^tests/' --exclude-files '\.png$' --exclude-files '^\.secrets\.baseline$' > /tmp/secrets.json
          python - <<'PY'
          import json, sys
          base = {(f, s["hashed_secret"]) for f, items in json.load(open(".secrets.baseline"))["results"].items()
                  for s in items if s.get("is_secret") is False}
          found = [(f, s["type"], s["line_number"]) for f, items in json.load(open("/tmp/secrets.json"))["results"].items()
                   for s in items if (f, s["hashed_secret"]) not in base]
          if found:
              sys.exit("İncelenmemiş olası sır: " + ", ".join(f"{f}:{n} ({t})" for f, t, n in found))
          print("Sır taraması temiz")
          PY
