name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    services:
      postgres:
        # Adım 6'da (güvenlik kapıları) imaj özetiyle sabitlenecek.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: tedarik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEDARIK_TEST_DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/tedarik_test' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        if: matrix.engine == 'postgres'
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py tedarik tests
      - name: Tests (${{ matrix.engine }})
        run: python -m unittest discover -s tests -v
